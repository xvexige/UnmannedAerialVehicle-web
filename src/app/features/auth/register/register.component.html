<div class="min-h-screen flex items-center justify-center bg-gray-900 px-4">
  <div class="w-full max-w-lg">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-9 h-9 bg-cyan-500 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
        </svg>
      </div>
      <span class="text-white text-lg font-semibold">DroneVision</span>
    </div>

    <h2 class="text-2xl font-bold text-white mb-1">注册企业账号</h2>
    <p class="text-gray-400 text-sm mb-7">创建企业管理员账号以使用平台服务</p>

    @if (success()) {
      <div class="p-4 bg-green-900/40 border border-green-700/50 rounded-lg text-green-400 text-center">
        注册成功！2秒后跳转到登录页...
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-gray-400 mb-2">企业名称</label>
            <input formControlName="tenant_name" type="text" placeholder="如：XX科技有限公司"
              class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition text-sm"/>
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-2">企业编码 <span class="text-xs text-gray-600">大写字母/数字</span></label>
            <input formControlName="tenant_code" type="text" placeholder="如：COMPANY_001"
              class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition text-sm"/>
          </div>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-2">管理员邮箱</label>
          <input formControlName="username" type="email" placeholder="admin@company.com"
            class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition text-sm"/>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-gray-400 mb-2">密码</label>
            <input formControlName="password" type="password" placeholder="至少8位，含大写字母和数字"
              class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition text-sm"/>
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-2">真实姓名</label>
            <input formControlName="real_name" type="text" placeholder="管理员姓名"
              class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition text-sm"/>
          </div>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-2">联系电话 <span class="text-gray-600">（选填）</span></label>
          <input formControlName="phone" type="tel" placeholder="13800138000"
            class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition text-sm"/>
        </div>

        @if (error()) {
          <div class="px-4 py-3 bg-red-900/30 border border-red-700/50 rounded-lg text-red-400 text-sm">{{ error() }}</div>
        }

        <button type="submit" [disabled]="loading() || form.invalid"
          class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 text-white font-semibold rounded-lg transition text-sm">
          {{ loading() ? '注册中...' : '注册' }}
        </button>
      </form>
    }

    <p class="text-center text-gray-500 text-sm mt-5">
      已有账号？<a routerLink="/auth/login" class="text-cyan-400 hover:text-cyan-300 transition">立即登录</a>
    </p>
  </div>
</div>
