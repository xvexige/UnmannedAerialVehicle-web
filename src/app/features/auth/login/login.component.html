<div class="min-h-screen flex">
  <!-- 左侧视觉背景 -->
  <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden bg-gray-950">
    <div class="absolute inset-0 bg-gradient-to-br from-blue-900/80 via-cyan-900/60 to-gray-950"></div>
    <!-- 科技网格背景 -->
    <div class="absolute inset-0"
      style="background-image: linear-gradient(rgba(0,212,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.05) 1px, transparent 1px); background-size: 40px 40px;">
    </div>
    <!-- 雷达扫描动画 -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
      <div class="w-64 h-64 rounded-full border border-cyan-500/20 animate-ping"></div>
      <div class="absolute inset-4 rounded-full border border-cyan-500/30 animate-ping" style="animation-delay:0.5s"></div>
      <div class="absolute inset-8 rounded-full border border-cyan-400/40 animate-ping" style="animation-delay:1s"></div>
      <div class="absolute inset-0 flex items-center justify-center">
        <svg class="w-20 h-20 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      </div>
    </div>
    <!-- 品牌文字 -->
    <div class="absolute bottom-12 left-12 right-12 text-white">
      <h1 class="text-3xl font-bold mb-3 text-cyan-300">无人机 SaaS 平台</h1>
      <p class="text-gray-400 text-sm leading-relaxed">
        基于 YOLO 小目标识别优化的智能无人机巡检平台<br>
        实时视频 AI 分析 · 多租户管理 · 交通数据统计
      </p>
      <div class="flex gap-6 mt-6">
        <div class="text-center">
          <div class="text-2xl font-bold text-cyan-400">92.1%</div>
          <div class="text-xs text-gray-500 mt-1">mAP@0.5</div>
        </div>
        <div class="text-center">
          <div class="text-2xl font-bold text-green-400">6.5%</div>
          <div class="text-xs text-gray-500 mt-1">漏检率</div>
        </div>
        <div class="text-center">
          <div class="text-2xl font-bold text-yellow-400">&lt;2s</div>
          <div class="text-xs text-gray-500 mt-1">推流延迟</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 右侧登录表单 -->
  <div class="flex-1 flex items-center justify-center bg-gray-900 px-8">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="flex items-center gap-3 mb-10">
        <div class="w-10 h-10 bg-cyan-500 rounded-lg flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </div>
        <span class="text-white text-xl font-semibold">DroneVision</span>
      </div>

      <h2 class="text-2xl font-bold text-white mb-2">欢迎登录</h2>
      <p class="text-gray-400 text-sm mb-8">请输入您的账号信息</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
        <div>
          <label class="block text-sm text-gray-400 mb-2">用户名 / 邮箱</label>
          <input formControlName="username" type="text" placeholder="请输入用户名或邮箱"
            class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition" />
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-2">密码</label>
          <input formControlName="password" type="password" placeholder="请输入密码"
            class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition" />
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-2">企业编码 <span class="text-gray-600">（超管可不填）</span></label>
          <input formControlName="tenant_code" type="text" placeholder="请输入企业编码，如：ENTERPRISE_001"
            class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition" />
        </div>

        @if (error()) {
          <div class="px-4 py-3 bg-red-900/30 border border-red-700/50 rounded-lg text-red-400 text-sm">
            {{ error() }}
          </div>
        }

        <button type="submit" [disabled]="loading() || form.invalid"
          class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold rounded-lg transition focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2 focus:ring-offset-gray-900">
          @if (loading()) {
            <span class="flex items-center justify-center gap-2">
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
              登录中...
            </span>
          } @else {
            登录
          }
        </button>
      </form>

      <p class="text-center text-gray-500 text-sm mt-6">
        还没有账号？
        <a routerLink="/auth/register" class="text-cyan-400 hover:text-cyan-300 transition">注册企业账号</a>
      </p>
    </div>
  </div>
</div>
